  <text x="432" y="316" font-family="Georgia, serif" font-size="34" fill="#e6e2d8">
    The families of the Bible,
  </text>
  <text x="432" y="362" font-family="Georgia, serif" font-size="34" fill="#e6e2d8">
    one line at a time
  </text>
  <text x="432" y="432" font-family="Georgia, serif" font-size="23" fill="#9a96a0">
    3,067 people · every relationship cited to a verse
  </text>
  <text x="432" y="470" font-family="Georgia, serif" font-size="23" fill="#9a96a0">
    biblekin.net
  </text>
