# Short bios (1–2 sentences) for the most significant figures. Written to
# state what the text records, not to interpret it. Sorted by id.

- id: aaron_1
  bio: Moses' elder brother and spokesman, made the first high priest of Israel.
    He also fashioned the golden calf while Moses was on Sinai.

- id: abel_13
  bio: Adam's second son, a keeper of sheep, whose offering God accepted and
    who was killed by his brother Cain — the first death recorded in Scripture.

- id: abraham_58
  bio: Called out of Ur to a land he did not know, he received the covenant
    promise of descendants as numerous as the stars. Father of Isaac and
    Ishmael, and the ancestor through whom the promise passed.

- id: adam_78
  bio: The first man, formed from the dust and placed in Eden. Father of Cain,
    Abel, and Seth, through whom the line of Genesis 5 continues.

- id: daniel_975
  bio: Taken captive to Babylon as a youth, he served under Nebuchadnezzar and
    successive kings while refusing to abandon his devotion, and received the
    visions recorded in his book.

- id: david_994
  bio: The shepherd boy anointed by Samuel who became Israel's second king,
    united the kingdom, and made Jerusalem its capital. The royal line and the
    messianic promise both run through him.

- id: deborah_997
  bio: A prophetess who judged Israel from beneath her palm tree and summoned
    Barak to battle against Sisera's army.

- id: elijah_1131
  bio: The prophet who confronted Ahab and the priests of Baal on Carmel, and
    was taken up in a whirlwind rather than dying.

- id: elisha_1153
  bio: Elijah's successor, who asked for a double portion of his spirit and
    served as prophet through the reigns of several kings of Israel.

- id: esther_1343
  bio: A Jewish orphan raised by her cousin Mordecai who became queen of Persia
    and risked her life to expose Haman's plot against her people.

- id: eve_1231
  bio: The first woman, formed as a companion for Adam and named "mother of all
    living." Mother of Cain, Abel, and Seth.

- id: isaac_616
  bio: The son promised to Abraham and Sarah in their old age, bound on Mount
    Moriah and spared. Father of Esau and Jacob.

- id: isaiah_617
  bio: Prophet in Judah through four reigns, called in the year King Uzziah
    died, whose book contains the servant songs and the promise of Immanuel.

- id: israel_682
  bio: Isaac's younger son, who bought the birthright, wrestled at Peniel and
    was renamed Israel. His twelve sons became the tribes of the nation.

- id: jeremiah_853
  bio: Called as a youth to prophesy against Judah before the exile, he saw
    Jerusalem fall and is traditionally credited with Lamentations.

- id: jesus_905
  bio: Born in Bethlehem to Mary, of the line of David through both recorded
    genealogies. Crucified under Pontius Pilate and proclaimed risen by his
    followers.

- id: job_1639
  bio: A blameless man of Uz who lost his children, wealth, and health, and
    contended with God about it. His family appears nowhere else in Scripture.

- id: john_1677
  bio: A fisherman, son of Zebedee, called with his brother James. Traditionally
    identified with the disciple "whom Jesus loved."

- id: joseph_1710
  bio: Jacob's favoured son, sold into Egypt by his brothers, who rose to rule
    under Pharaoh and preserved his family through the famine.

- id: joseph_1715
  bio: A carpenter of Nazareth, betrothed to Mary. Matthew and Luke give him
    different fathers, and both trace his descent from David.

- id: joshua_1727
  bio: Moses' assistant and one of the two spies who trusted the promise. He
    led Israel across the Jordan and through the conquest of Canaan.

- id: judah_1751
  bio: Jacob's fourth son, who proposed selling Joseph and later offered
    himself in Benjamin's place. The royal tribe descends from him.

- id: mary_1938
  bio: A young woman of Nazareth, betrothed to Joseph, who bore Jesus. She
    appears again at Cana, at the cross, and among the disciples after the
    ascension.

- id: melchisedec_1991
  bio: King of Salem and priest of God Most High, who blessed Abraham and
    received a tithe. Hebrews notes he appears without recorded genealogy.

- id: miriam_2087
  bio: Sister of Moses and Aaron, who watched over him in the reeds and led
    Israel's women in song after the crossing of the sea.

- id: mordecai_2107
  bio: A Jew of the exile in Susa who raised his cousin Esther, refused to bow
    to Haman, and was raised to high office in Persia.

- id: moses_2108
  bio: Drawn from the Nile and raised in Pharaoh's household, he led Israel out
    of Egypt, received the law at Sinai, and died within sight of the promised
    land.

- id: nebuchadnezzar_2167
  bio: King of Babylon who destroyed Jerusalem and carried Judah into exile.
    His dreams and their interpretations run through the book of Daniel.

- id: noah_2210
  bio: Found righteous in a corrupt generation, he built the ark and survived
    the flood with his family. Father of Shem, Ham, and Japheth.

- id: paul_2479
  bio: A Pharisee who persecuted the early church until his encounter on the
    Damascus road, after which he carried the message across the Roman world
    and wrote much of the New Testament.

- id: peter_2745
  bio: A fisherman of Galilee called with his brother Andrew, who confessed
    Jesus as the Christ, denied him, and was restored.

- id: rebekah_2401
  bio: Found at the well by Abraham's servant and married to Isaac. She secured
    the blessing for her younger son Jacob.

- id: ruth_2450
  bio: A Moabite widow who refused to leave her mother-in-law Naomi, gleaned in
    the fields of Boaz, and became great-grandmother to David.

- id: samuel_2469
  bio: Given to the sanctuary as a child, he became the last judge and the
    prophet who anointed both Saul and David.

- id: sarah_2473
  bio: Abraham's wife, who laughed at the promise of a son and bore Isaac at
    ninety. She sent Hagar and Ishmael away.

- id: saul_2478
  bio: Israel's first king, chosen from Benjamin, whose reign unravelled after
    he disobeyed Samuel. He died with his sons at Gilboa.

- id: solomon_2762
  bio: David's son by Bathsheba, who asked for wisdom, built the temple, and
    ruled at the height of Israel's power. His foreign wives turned his heart
    late in life.
